<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04050a">
<title>Windows 12</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#4cc2ff;
  --glass:rgba(30,30,36,.78);
  --glass2:rgba(44,44,52,.86);
  --stroke:rgba(255,255,255,.1);
  --txt:#f2f4f8;
  --txt2:#a8adb8;
  --hover:rgba(255,255,255,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  background:#04050a;color:var(--txt);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-font-smoothing:antialiased;
  position:fixed;inset:0;touch-action:manipulation;
}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
/* прокручиваемые области — вертикальный скролл пальцем */
.exp-content,.exp-side,.term,.set-main,.sm-rec,.np textarea,.win-body{ touch-action:pan-y; -webkit-overflow-scrolling:touch; }

/* ============ ОБОИ ============ */
#wall{position:fixed;inset:0;overflow:hidden;background:#04050a;z-index:0}
#wall::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,transparent 30%,rgba(0,0,0,.55) 100%);pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 30s ease-in-out infinite}
.b1{width:60vw;height:60vw;left:-16vw;top:-18vw;background:#1f56c9}
.b2{width:54vw;height:54vw;right:-14vw;top:4vh;background:#7b2ff7;animation-delay:-8s}
.b3{width:52vw;height:52vw;left:18vw;bottom:-22vw;background:#00b8d4;animation-delay:-15s}
.b4{width:36vw;height:36vw;right:10vw;bottom:0;background:#ff3d81;opacity:.28;animation-delay:-5s}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(5vw,3vh) scale(1.08)}
  66%{transform:translate(-4vw,-2vh) scale(.94)}
}
#wallGrid{position:absolute;inset:0;opacity:.15;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 78%);
  mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 78%)}

/* ============ ЗАГРУЗКА ============ */
#boot{position:fixed;inset:0;background:#000;z-index:9000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:44px;transition:opacity .7s}
#boot.gone{opacity:0;pointer-events:none}
.logo4{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:74px;height:74px;
  filter:drop-shadow(0 0 22px rgba(76,194,255,.55));animation:logoIn 1.2s cubic-bezier(.2,.9,.3,1)}
.logo4 div{background:linear-gradient(135deg,#8fe0ff,#4cc2ff);border-radius:3px}
@keyframes logoIn{from{opacity:0;transform:scale(.5) rotate(-25deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.13);border-top-color:#4cc2ff;
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bootText{position:absolute;bottom:calc(70px + var(--safe-b));color:#5c6270;font-size:13px;letter-spacing:.5px}

/* ============ ЭКРАН ВХОДА ============ */
#lock{position:fixed;inset:0;z-index:8500;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  transition:opacity .6s,transform .6s;
  background:linear-gradient(160deg,#0b1226,#1a0f2e 50%,#06121c)}
#lock.gone{opacity:0;transform:scale(1.08);pointer-events:none}
#lockTime{font-size:clamp(64px,16vw,110px);font-weight:200;letter-spacing:-3px;
  text-shadow:0 6px 40px rgba(0,0,0,.6)}
#lockDate{font-size:19px;color:#b9c0cf;margin-top:-8px;text-transform:capitalize}
#lockHint{margin-top:60px;padding:16px 30px;border-radius:999px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-size:15px;color:#dfe4ee;animation:pulseHint 2.4s ease-in-out infinite}
@keyframes pulseHint{0%,100%{opacity:.6}50%{opacity:1}}
#lockUser{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:-20px}
.avatarBig{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;
  font-size:46px;font-weight:600;background:linear-gradient(135deg,#4cc2ff,#7c5cff);
  box-shadow:0 14px 50px rgba(76,194,255,.4)}

/* ============ РАБОЧИЙ СТОЛ ============ */
#desk{position:fixed;inset:0;z-index:10;opacity:0;transition:opacity .8s}
#desk.on{opacity:1}
#icons{position:absolute;top:calc(16px + var(--safe-t));left:calc(16px + var(--safe-l));
  display:grid;grid-template-columns:repeat(auto-fill,104px);
  grid-auto-flow:column;grid-template-rows:repeat(6,106px);gap:4px;z-index:11}
.dicon{width:104px;height:106px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;border-radius:12px;font-size:12px;text-align:center;
  padding:8px 4px;transition:background .12s;border:1px solid transparent;
  -webkit-user-select:none;user-select:none}
.dicon:active,.dicon.sel{background:rgba(76,194,255,.24);border-color:rgba(76,194,255,.5)}
.dicon span:first-child{font-size:38px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.dicon span:last-child{text-shadow:0 1px 4px rgba(0,0,0,.9);line-height:1.25;
  max-width:100px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ============ ОКНА ============ */
.win{position:fixed;background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid var(--stroke);border-radius:14px;display:flex;flex-direction:column;
  box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05) inset;
  overflow:hidden;animation:winIn .26s cubic-bezier(.2,.9,.3,1);
  min-width:300px;min-height:220px}
@keyframes winIn{from{opacity:0;transform:scale(.93) translateY(14px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .2s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.94) translateY(10px)}}
.win.max{border-radius:0!important}
.win.minimized{display:none}
.win-tb{height:46px;display:flex;align-items:center;justify-content:space-between;
  padding-left:16px;flex:0 0 46px;background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,255,255,.06);touch-action:none}
.win-tt{display:flex;align-items:center;gap:9px;font-size:13px;color:#dde2ec;font-weight:500;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win-tt .ico{font-size:16px}
.win-ctrls{display:flex;height:100%}
.win-ctrls button{width:54px;height:100%;border:0;background:transparent;color:#cfd5e0;
  font-size:15px;cursor:pointer;transition:background .12s;display:grid;place-items:center;
  touch-action:manipulation}
.win-ctrls button:active{background:rgba(255,255,255,.14)}
.win-ctrls button[data-a="close"]:active{background:#e81123;color:#fff}
.win-body{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.win-res{position:absolute;right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize;z-index:5;
  touch-action:none}
.win-res::after{content:'';position:absolute;right:6px;bottom:6px;width:12px;height:12px;
  border-right:2px solid rgba(255,255,255,.3);border-bottom:2px solid rgba(255,255,255,.3);
  border-radius:0 0 3px 0}

/* ============ ПРОВОДНИК ============ */
.exp{display:flex;flex-direction:column;height:100%;font-size:13.5px}
.exp-tb{display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.nav-btn{width:42px;height:42px;border-radius:9px;border:0;background:transparent;color:#cfd5e0;
  cursor:pointer;font-size:19px;transition:background .12s;flex:0 0 42px;touch-action:manipulation}
.nav-btn:active{background:rgba(255,255,255,.14)}
.nav-btn:disabled{opacity:.25}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);border-radius:9px;padding:3px 10px;height:42px;overflow-x:auto;
  overflow-y:hidden;touch-action:pan-x;white-space:nowrap;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;color:#cfd5e0;
  touch-action:manipulation}
.crumb:active{background:rgba(255,255,255,.14)}
.crumb-sep{color:#6b7280;font-size:11px}
.exp-search input{width:150px;height:42px;border-radius:9px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);color:var(--txt);padding:0 12px;font-size:16px;outline:none}
.exp-search input:focus{border-color:var(--accent)}
.exp-main{flex:1;display:flex;overflow:hidden}
.exp-side{width:190px;flex:0 0 190px;padding:8px 6px;overflow-y:auto;
  border-right:1px solid rgba(255,255,255,.06)}
.side-item{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:9px;
  cursor:pointer;color:#c3c9d6;font-size:13px;transition:background .12s;touch-action:manipulation}
.side-item:active{background:rgba(255,255,255,.12)}
.side-item.active{background:rgba(76,194,255,.18);color:#fff}
.side-item .e{font-size:17px}
.exp-content{flex:1;overflow-y:auto;padding:12px;align-content:start;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;
  border-radius:11px;cursor:pointer;font-size:12px;text-align:center;border:1px solid transparent;
  transition:background .12s;touch-action:manipulation}
.tile:active,.tile.sel{background:rgba(76,194,255,.22);border-color:rgba(76,194,255,.5)}
.tile .e{font-size:40px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.tile .n{max-width:104px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;line-height:1.25}
.exp-status{height:30px;flex:0 0 30px;display:flex;align-items:center;padding:0 14px;
  font-size:12px;color:var(--txt2);border-top:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-msg{grid-column:1/-1;text-align:center;color:#7a8290;padding:50px 0;font-size:14px}

/* ============ БЛОКНОТ ============ */
.np{display:flex;flex-direction:column;height:100%}
.np-menu{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);
  font-size:13px;overflow-x:auto;scrollbar-width:none}
.np-menu::-webkit-scrollbar{display:none}
.np-menu span{padding:9px 14px;border-radius:8px;cursor:pointer;color:#c3c9d6;white-space:nowrap;
  touch-action:manipulation}
.np-menu span:active{background:rgba(255,255,255,.14)}
.np textarea{flex:1;background:rgba(0,0,0,.25);border:0;outline:none;color:#e8ecf4;
  padding:16px;font-size:16px;resize:none;line-height:1.6;
  font-family:'Cascadia Code',Menlo,Consolas,monospace}

/* ============ КАЛЬКУЛЯТОР ============ */
.calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px;background:rgba(0,0,0,.18)}
.calc-out{text-align:right;padding:14px 14px 4px;font-size:16px;color:#8b93a3;
  min-height:24px;overflow:hidden}
.calc-main{text-align:right;padding:0 14px 10px;font-size:44px;font-weight:300;overflow:hidden;
  text-overflow:ellipsis;line-height:1.1}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.07);
  color:#eef2f8;border-radius:11px;font-size:20px;cursor:pointer;transition:.1s;
  font-family:inherit;touch-action:manipulation}
.calc-grid button:active{background:rgba(255,255,255,.2);transform:scale(.95)}
.calc-grid .op{background:rgba(76,194,255,.18);color:#8fd9ff}
.calc-grid .eq{background:linear-gradient(135deg,#4cc2ff,#2f8fd6);color:#001a2b;font-weight:600}
.calc-grid .fn{background:rgba(255,255,255,.04);color:#a9b2c2;font-size:17px}

/* ============ ПАРАМЕТРЫ ============ */
.set{display:flex;height:100%;font-size:13.5px}
.set-side{width:180px;flex:0 0 180px;padding:14px 8px;border-right:1px solid rgba(255,255,255,.06)}
.set-main{flex:1;overflow-y:auto;padding:18px 22px}
.set-title{font-size:21px;font-weight:600;margin-bottom:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 16px;background:rgba(255,255,255,.045);border:1px solid var(--stroke);
  border-radius:10px;margin-bottom:10px}
.set-row small{display:block;color:var(--txt2);font-size:12px;margin-top:3px}
.sw{width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.16);position:relative;
  cursor:pointer;transition:.2s;flex:0 0 52px;touch-action:manipulation}
.sw::after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.sw.on{background:var(--accent)}
.sw.on::after{left:25px}
.wp-row{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.wp{width:80px;height:52px;border-radius:9px;cursor:pointer;border:2px solid transparent;
  transition:.15s;touch-action:manipulation}
.wp:active{transform:scale(.95)}
.wp.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,194,255,.25)}
input[type=range]{width:150px;accent-color:var(--accent);height:32px}

/* ============ ТЕРМИНАЛ ============ */
.term{flex:1;background:rgba(6,8,14,.88);padding:14px;overflow-y:auto;
  font-family:'Cascadia Code',Menlo,Consolas,monospace;font-size:13px;line-height:1.55;
  color:#c9f7c0;word-break:break-word}
.term-in{display:flex;gap:7px;padding:10px 14px;background:rgba(6,8,14,.88);
  border-top:1px solid rgba(255,255,255,.07)}
.term-in span{color:#7ee787;font-family:Menlo,Consolas,monospace;font-size:13px;
  white-space:nowrap;display:flex;align-items:center}
.term-in input{flex:1;background:transparent;border:0;outline:none;color:#e8ffdf;
  font-family:Menlo,Consolas,monospace;font-size:16px;padding:4px 0;min-width:0}

/* ============ ПАНЕЛЬ ЗАДАЧ ============ */
#taskbar{position:fixed;bottom:calc(12px + var(--safe-b));
  left:calc(50% + var(--safe-l)/2 - var(--safe-r)/2);
  transform:translateX(-50%) translateY(140px);
  display:flex;align-items:center;gap:8px;z-index:5000;
  transition:transform .5s cubic-bezier(.2,.9,.3,1);max-width:calc(100vw - 20px)}
#taskbar.on{transform:translateX(-50%) translateY(0)}
.tb-bar{display:flex;align-items:center;gap:4px;padding:7px 9px;border-radius:18px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(34px) saturate(1.7);backdrop-filter:blur(34px) saturate(1.7);
  border:1px solid var(--stroke);box-shadow:0 20px 50px rgba(0,0,0,.55)}
.tb-btn{width:50px;height:50px;border-radius:12px;border:0;background:transparent;color:#dde2ec;
  font-size:23px;cursor:pointer;display:grid;place-items:center;transition:background .14s,transform .14s;
  position:relative;touch-action:manipulation}
.tb-btn:active{background:rgba(255,255,255,.16);transform:scale(.92)}
.tb-btn.running::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent)}
.tb-btn.active{background:rgba(255,255,255,.14)}
.tb-btn.active::after{width:18px;border-radius:3px}
.start-logo{display:grid;grid-template-columns:1fr 1fr;gap:2.5px;width:21px;height:21px}
.start-logo i{background:linear-gradient(135deg,#9be4ff,#4cc2ff);border-radius:1.5px}
.tb-tray{display:flex;align-items:center;gap:12px;padding:0 16px;height:64px;border-radius:18px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(34px) saturate(1.7);backdrop-filter:blur(34px) saturate(1.7);
  border:1px solid var(--stroke);box-shadow:0 20px 50px rgba(0,0,0,.55);font-size:15px}
.tray-ico{cursor:pointer;opacity:.9;transition:opacity .12s,transform .12s;font-size:17px;
  touch-action:manipulation;padding:4px}
.tray-ico:active{opacity:1;transform:scale(1.2)}
.clock{text-align:right;font-size:12px;line-height:1.35;cursor:pointer;padding-left:8px;
  border-left:1px solid rgba(255,255,255,.12)}
#clkTime{font-size:14px;font-weight:500}

/* ============ ПУСК ============ */
#start{position:fixed;bottom:calc(92px + var(--safe-b));left:50%;
  transform:translateX(-50%) translateY(26px) scale(.97);
  width:min(640px,calc(100vw - 28px));
  height:min(620px,calc(100dvh - 140px - var(--safe-t) - var(--safe-b)));
  background:var(--glass);
  -webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7);
  border:1px solid var(--stroke);border-radius:20px;z-index:5200;
  box-shadow:0 40px 100px rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;display:flex;flex-direction:column;padding:22px}
#start.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.sm-search{margin-bottom:16px}
.sm-search input{width:100%;height:48px;border-radius:999px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.07);color:var(--txt);padding:0 20px;font-size:16px;outline:none}
.sm-search input:focus{border-color:var(--accent);background:rgba(255,255,255,.1)}
.sm-label{font-size:12.5px;color:var(--txt2);margin:6px 4px 10px;font-weight:600}
.sm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;
  border-radius:11px;cursor:pointer;font-size:11.5px;text-align:center;transition:background .12s;
  touch-action:manipulation}
.sm-app:active{background:rgba(255,255,255,.14)}
.sm-app .e{font-size:30px}
.sm-rec{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start;
  min-height:0}
.sm-rec-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;
  cursor:pointer;font-size:13px;transition:background .12s;touch-action:manipulation}
.sm-rec-item:active{background:rgba(255,255,255,.14)}
.sm-rec-item .e{font-size:24px}
.sm-rec-item small{display:block;color:var(--txt2);font-size:11.5px;margin-top:2px}
.sm-rec-item>div{min-width:0;overflow:hidden}
.sm-rec-item>div>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.sm-user{display:flex;align-items:center;gap:11px;font-size:13.5px;padding:8px 12px;
  border-radius:9px;cursor:pointer;touch-action:manipulation}
.sm-user:active{background:rgba(255,255,255,.12)}
.avatarSm{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;
  font-weight:600;background:linear-gradient(135deg,#4cc2ff,#7c5cff)}
.sm-power{width:46px;height:46px;border-radius:10px;border:0;background:transparent;color:#cfd5e0;
  font-size:19px;cursor:pointer;transition:background .12s;touch-action:manipulation}
.sm-power:active{background:rgba(232,17,35,.75);color:#fff}

/* ============ КОНТЕКСТНОЕ МЕНЮ ============ */
#ctx{position:fixed;z-index:6000;min-width:220px;padding:7px;border-radius:12px;
  background:var(--glass2);
  -webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);
  border:1px solid var(--stroke);box-shadow:0 22px 60px rgba(0,0,0,.65);
  opacity:0;pointer-events:none;transform:scale(.94);transition:.13s;transform-origin:top left}
#ctx.on{opacity:1;pointer-events:auto;transform:scale(1)}

<script>
'use strict';

/* ============================================================
   ЗВУК — Web Audio API (на iOS стартует только по касанию)
   ============================================================ */
const Snd = {
  ctx:null, enabled:true, volume:0.55,
  init(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      try{ this.ctx = new AC(); }catch(e){ return; }
    }
    // iOS: контекст часто в состоянии suspended
    if(this.ctx.state !== 'running'){
      const p = this.ctx.resume();
      if(p && p.catch) p.catch(()=>{});
    }
  },
  tone(freq, dur, o){
    o = o || {};
    if(!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t + dur);
    const vol = Math.max(0.0002, (o.vol || 0.08) * this.volume);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.06);
  },
  noise(dur, vol){
    dur = dur || 0.15; vol = vol || 0.05;
    if(!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
    const c = this.ctx, n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol * this.volume;
    const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; f.Q.value=0.8;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  },
  click(){ this.tone(1750,0.045,{type:'triangle',vol:0.045}); this.noise(0.04,0.02); },
  hover(){ this.tone(2600,0.018,{type:'sine',vol:0.012}); },
  open(){ this.tone(420,0.16,{type:'sine',vol:0.07,glide:880}); this.tone(880,0.1,{type:'sine',vol:0.03,delay:0.05}); },
  close(){ this.tone(760,0.15,{type:'sine',vol:0.06,glide:300}); },
  minimize(){ this.tone(900,0.12,{type:'sine',vol:0.05,glide:420}); },
  maximize(){ this.tone(420,0.13,{type:'sine',vol:0.05,glide:1000}); },
  error(){ this.tone(200,0.16,{type:'square',vol:0.05}); this.tone(150,0.22,{type:'square',vol:0.05,delay:0.14}); },
  notify(){ this.tone(1046,0.1,{type:'sine',vol:0.05}); this.tone(1568,0.14,{type:'sine',vol:0.045,delay:0.09}); },
  nav(){ this.tone(1200,0.05,{type:'sine',vol:0.035}); },
  lockSound(){ this.tone(660,0.2,{type:'sine',vol:0.05,glide:440}); this.tone(440,0.35,{type:'sine',vol:0.04,delay:0.15}); },
  startup(){
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
    notes.forEach((f,i)=> this.tone(f,1.3,{type:'sine',vol:0.055,delay:i*0.085,attack:0.03}));
    this.tone(130.81,2.4,{type:'sine',vol:0.06,attack:0.15});
    this.tone(196.00,2.2,{type:'sine',vol:0.045,delay:0.06,attack:0.15});
    this.tone(261.63,2.0,{type:'sine',vol:0.04,delay:0.12,attack:0.15});
    [1568,2093,2637].forEach((f,i)=>
      this.tone(f,0.6,{type:'triangle',vol:0.018,delay:0.55+i*0.11}));
  }
};

/* первый жест где угодно — инициализируем аудио (требование iOS) */
function primeAudio(){ Snd.init(); }
document.addEventListener('pointerdown', primeAudio, {passive:true});
document.addEventListener('touchstart', primeAudio, {passive:true});

/* ============================================================
   ХЕЛПЕР: тап / долгое нажатие (работает и мышью, и пальцем)
   ============================================================ */
function onTap(el, cb, opts){
  opts = opts || {};
  const longMs = opts.longMs || 520;
  let timer = null, sx = 0, sy = 0, moved = false, fired = false, active = false;

  el.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    active = true; fired = false; moved = false;
    sx = e.clientX; sy = e.clientY;
    clearTimeout(timer);
    if(opts.long){
      timer = setTimeout(() => {
        fired = true;
        if(navigator.vibrate) navigator.vibrate(12);
        opts.long(e);
      }, longMs);
    }
  }, {passive:true});

  el.addEventListener('pointermove', e => {
    if(!active) return;
    if(Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12){
      moved = true; clearTimeout(timer);
    }
  }, {passive:true});

  const end = e => {
    if(!active) return;
    active = false;
    clearTimeout(timer);
    if(fired || moved) return;
    if(e.type === 'pointercancel') return;
    cb(e);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', e => { active = false; clearTimeout(timer); });
}

function getNode(path){
  let n = FS;
  for(let i = 1; i < path.length; i++){
    if(!n.children) return null;
    const next = n.children.find(c => c.name === path[i]);
    if(!next) return null;
    n = next;
  }
  return n;
}
const EXT_ICON = { html:'📄', css:'🎨', js:'📜', txt:'📃', md:'📝', png:'🖼️', jpg:'🖼️',
  mp3:'🎵', mp4:'🎬', exe:'⚙️', xlsx:'📊', docx:'📘', pdf:'📕', zip:'🗜️' };
function iconFor(node){
  if(node.type === 'folder') return '📁';
  return EXT_ICON[(node.ext || '').toLowerCase()] || '📄';
}

/* ============================================================
   МЕНЕДЖЕР ОКОН (Pointer Events — мышь + палец)
   ============================================================ */
const WM = {
  z:100,
  wins:new Map(),
  open(appId){
    const app = APPS[appId];
    if(!app) return;
    const existing = this.wins.get(appId);
    if(existing){
      if(existing.el.classList.contains('minimized')){
        existing.el.classList.remove('minimized');
        Snd.open();
      } else {
        this.focus(appId);
        Snd.click();
      }
      this.updateTaskbar();
      return;
    }
    const el = document.createElement('div');
    el.className = 'win';
    const w = Math.min(app.w, innerWidth - 40);
    const h = Math.min(app.h, innerHeight - 170);
    const x = Math.max(10, Math.round((innerWidth - w) / 2 + (Math.random()*60 - 30)));
    const y = Math.max(10, Math.round((innerHeight - h) / 2 - 60 + (Math.random()*40 - 20)));
    el.style.cssText = 'width:'+w+'px;height:'+h+'px;left:'+x+'px;top:'+y+'px;z-index:'+(++this.z);
    el.innerHTML =
      '<div class="win-tb">'+
        '<div class="win-tt"><span class="ico">'+app.icon+'</span><span>'+app.title+'</span></div>'+
        '<div class="win-ctrls">'+
          '<button data-a="min" title="Свернуть">–</button>'+
          '<button data-a="max" title="Развернуть">□</button>'+
          '<button data-a="close" title="Закрыть">✕</button>'+
        '</div>'+
      '</div>'+
      '<div class="win-body"></div>'+
      '<div class="win-res"></div>';
    document.body.appendChild(el);

    const rec = { el, appId, maximized:false, prev:null };
    this.wins.set(appId, rec);

    // фокус — но не мешаем кнопкам управления
    el.addEventListener('pointerdown', () => this.focus(appId), {passive:true});

    el.querySelector('.win-ctrls').addEventListener('click', e => {
      const a = e.target.dataset.a;
      if(!a) return;
      e.stopPropagation();
      if(a === 'close'){
        Snd.close(); el.classList.add('closing');
        setTimeout(() => { el.remove(); WM.wins.delete(appId); WM.updateTaskbar(); }, 190);
      }
      if(a === 'min'){ Snd.minimize(); el.classList.add('minimized'); this.updateTaskbar(); }
      if(a === 'max'){ Snd.maximize(); this.toggleMax(appId); }
    });

    this.makeDraggable(el, appId);
    this.makeResizable(el, appId);
    app.build(el.querySelector('.win-body'));
    Snd.open();
    this.updateTaskbar();
  },

  toggleMax(appId){
    const r = this.wins.get(appId); if(!r) return;
    const el = r.el;
    if(!r.maximized){
      r.prev = { w:el.style.width, h:el.style.height, l:el.style.left, t:el.style.top };
      el.style.left = '0px';
      el.style.top = '0px';
      el.style.width = '100vw';
      el.style.height = '100vh';
      el.classList.add('max'); r.maximized = true;
    } else {
      el.style.width = r.prev.w; el.style.height = r.prev.h;
      el.style.left = r.prev.l;  el.style.top = r.prev.t;
      el.classList.remove('max'); r.maximized = false;
    }
  },

  focus(appId){
    const r = this.wins.get(appId); if(!r) return;
    r.el.style.zIndex = ++this.z;
    this.updateTaskbar();
  },

  updateTaskbar(){
    document.querySelectorAll('.tb-btn[data-app]').forEach(b => {
      const on = this.wins.has(b.dataset.app);
      b.classList.toggle('running', on);
      const r = this.wins.get(b.dataset.app);
      b.classList.toggle('active',
        !!r && !r.el.classList.contains('minimized') && r.el.style.zIndex == this.z);
    });
  },

  /* перетаскивание заголовком — мышью и пальцем */
  makeDraggable(el, appId){
    const tb = el.querySelector('.win-tb');
    let sx=0, sy=0, ox=0, oy=0, dragging=false, pid=null;

    tb.addEventListener('pointerdown', e => {
      if(e.target.closest('.win-ctrls')) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      const r = this.wins.get(appId);
      if(r && r.maximized) return;
      dragging = true; pid = e.pointerId;
      sx = e.clientX; sy = e.clientY;
      ox = el.offsetLeft; oy = el.offsetTop;
      try{ tb.setPointerCapture(e.pointerId); }catch(err){}
      el.style.transition = 'none';
    });

    tb.addEventListener('pointermove', e => {
      if(!dragging || e.pointerId !== pid) return;
      let nx = ox + e.clientX - sx;
      let ny = oy + e.clientY - sy;
      nx = Math.max(-el.offsetWidth + 100, Math.min(nx, innerWidth - 100));
      ny = Math.max(0, Math.min(ny, innerHeight - 90));
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
    });

    const stop = e => {
      if(!dragging) return;
      if(e && e.pointerId !== pid) return;
      dragging = false; pid = null;
      try{ tb.releasePointerCapture(e.pointerId); }catch(err){}
    };
    tb.addEventListener('pointerup', stop);
    tb.addEventListener('pointercancel', stop);
  },

  /* изменение размера — уголком */
  makeResizable(el, appId){
    const h = el.querySelector('.win-res');
    let sx=0, sy=0, sw=0, sh=0, on=false, pid=null;

    h.addEventListener('pointerdown', e => {
      const r = this.wins.get(appId);
      if(r && r.maximized) return;
      on = true; pid = e.pointerId;
      sx = e.clientX; sy = e.clientY;
      sw = el.offsetWidth; sh = el.offsetHeight;
      try{ h.setPointerCapture(e.pointerId); }catch(err){}
    });

    h.addEventListener('pointermove', e => {
      if(!on || e.pointerId !== pid) return;
      el.style.width  = Math.max(300, sw + e.clientX - sx) + 'px';
      el.style.height = Math.max(220, sh + e.clientY - sy) + 'px';
    });

    const stop = e => {
      if(!on) return;
      if(e && e.pointerId !== pid) return;
      on = false; pid = null;
      try{ h.releasePointerCapture(e.pointerId); }catch(err){}
    };
    h.addEventListener('pointerup', stop);
    h.addEventListener('pointercancel', stop);
  }
};

/* ---------- ПРОВОДНИК ---------- */

function buildExplorer(body){
  body.innerHTML =
    '<div class="exp">'+
      '<div class="exp-tb">'+
        '<button class="nav-btn" data-nav="back" title="Назад">‹</button>'+

    { label:'Видео',        e:'🎬', path:['Этот компьютер','Видео'] },
    { label:'Этот компьютер',e:'💻', path:['Этот компьютер'] }
  ];

    '<div class="side-item" data-i="'+i+'"><span class="e">'+it.e+'</span><span>'+it.label+'</span></div>'
  ).join('');
  side.querySelectorAll('.side-item').forEach(el => {
    onTap(el, () => { Snd.nav(); expNavigate(sideItems[+el.dataset.i].path); });
  });

  body.querySelector('.exp-tb').addEventListener('click', e => {
    const nav = e.target.dataset.nav;
    if(!nav) return;
    Snd.click();
    if(nav === 'back' && expHi > 0){ expHi--; expPath = expHist[expHi]; expRender(body); }
    if(nav === 'fwd' && expHi < expHist.length - 1){ expHi++; expPath = expHist[expHi]; expRender(body); }
    if(nav === 'up' && expPath.length > 1){ expNavigate(expPath.slice(0,-1)); }
  });

  body.querySelector('#expSearch').addEventListener('input', e => {
    expRender(body, e.target.value.toLowerCase());
  });

  expRender(body);
}

function expNavigate(path){
  expPath = path.slice();
  if(expHi < expHist.length - 1) expHist = expHist.slice(0, expHi + 1);
  expHist.push(expPath.slice()); expHi = expHist.length - 1;
  const w = WM.wins.get('explorer');
  if(w) expRender(w.el.querySelector('.win-body'));
}

function expRender(body, filter){
  filter = filter || '';
  const node = getNode(expPath);
  if(!node) return;

  // крошки
  const crumbs = body.querySelector('.crumbs');
  crumbs.innerHTML = expPath.map((p,i) =>
    '<span class="crumb" data-i="'+i+'">'+p+'</span>' +
    (i < expPath.length - 1 ? '<span class="crumb-sep">›</span>' : '')
  ).join('');
  crumbs.querySelectorAll('.crumb').forEach(c => {
    onTap(c, () => { Snd.nav(); expNavigate(expPath.slice(0, +c.dataset.i + 1)); });
  });

  // кнопки навигации
  const btns = body.querySelectorAll('.nav-btn');
  btns[0].disabled = expHi <= 0;
  btns[1].disabled = expHi >= expHist.length - 1;
  btns[2].disabled = expPath.length <= 1;

  // сайдбар
  body.querySelectorAll('.side-item').forEach((el,i) => {
    el.classList.toggle('active',
      expPath[expPath.length - 1] === SIDE_LABELS[i] || (i === 6 && expPath.length === 1));
  });

  // содержимое
  const cont = body.querySelector('#expContent');
  let items = (node.children || []).slice();
  if(filter) items = items.filter(c => c.name.toLowerCase().indexOf(filter) !== -1);
  items.sort((a,b) => a.type === b.type ? a.name.localeCompare(b.name)
                                        : (a.type === 'folder' ? -1 : 1));

  if(items.length === 0){
    cont.innerHTML = '<div class="empty-msg">' +
      (filter ? 'Ничего не найдено' : 'Эта папка пуста') + '</div>';
  } else {
    cont.innerHTML = items.map((it,i) =>
      '<div class="tile" data-i="'+i+'">'+
        '<span class="e">'+iconFor(it)+'</span>'+
        '<span class="n">'+it.name+'</span>'+
      '</div>'
    ).join('');

    cont.querySelectorAll('.tile').forEach(t => {
      const item = items[+t.dataset.i];
      onTap(t, () => {
        cont.querySelectorAll('.tile').forEach(x => x.classList.remove('sel'));
        t.classList.add('sel');
        if(item.type === 'folder'){
          Snd.nav();
          expNavigate(expPath.concat([item.name]));
        } else if(item.content !== undefined){
          Snd.open();
          openInNotepad(item.name, item.content);
        } else {
          Snd.error();
          toast('Не удалось открыть «' + item.name + '»', '⚠️');
        }
      }, {
        long:e => {
          cont.querySelectorAll('.tile').forEach(x => x.classList.remove('sel'));
          t.classList.add('sel');
          showCtx(e.clientX, e.clientY, [
            { a:'open', e:'📂', t:'Открыть', fn:() => {
                if(item.type === 'folder') expNavigate(expPath.concat([item.name]));
                else if(item.content !== undefined) openInNotepad(item.name, item.content);
                else { Snd.error(); toast('Формат не поддерживается', '⚠️'); }
              } },
            { a:'rename', e:'✏️', t:'Переименовать', fn:() => toast('Переименование недоступно в демо', '✏️') },
            { sep:true },
            { a:'props', e:'ℹ️', t:'Свойства', fn:() =>
                toast(item.name + ' • ' + (item.size || 'папка'), '📄') }
          ]);
        }
      });
    });
  }

  const n = items.length;
  const word = n === 1 ? 'элемент' : (n > 1 && n < 5 ? 'элемента' : 'элементов');
  body.querySelector('#expStatus').textContent =
    n + ' ' + word + '  •  ' + expPath.join(' \\ ');
}

/* ---------- КАЛЬКУЛЯТОР ---------- */
function buildCalc(body){
  body.innerHTML =
    '<div class="calc">'+
      '<div class="calc-out" id="cOut"></div>'+
      '<div class="calc-main" id="cMain">0</div>'+
      '<div class="calc-grid">'+
        '<button class="fn" data-k="C">C</button>'+
        '<button class="fn" data-k="±">±</button>'+
        '<button class="fn" data-k="%">%</button>'+
        '<button class="op" data-k="/">÷</button>'+
        '<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>'+
        '<button class="op" data-k="*">×</button>'+
        '<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>'+
        '<button class="op" data-k="-">−</button>'+
        '<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>'+
        '<button class="op" data-k="+">+</button>'+
        '<button data-k="0" style="grid-column:span 2">0</button>'+
        '<button data-k=".">,</button>'+
        '<button class="eq" data-k="=">=</button>'+
      '</div>'+
    '</div>';

  let cur = '0', prev = null, op = null, fresh = true;
  const mainEl = body.querySelector('#cMain');
  const outEl = body.querySelector('#cOut');
  const upd = () => { mainEl.textContent = cur; };

  function calc(a, b, o){
    a = +a; b = +b;
    if(o === '+') return a + b;
    if(o === '-') return a - b;
    if(o === '*') return a * b;
    if(o === '/') return b === 0 ? NaN : a / b;
    return b;
  }

  body.querySelector('.calc-grid').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    const k = b.dataset.k;
    Snd.tone(k === '=' ? 880 : 1500, 0.04, {type:'triangle', vol:0.045});

    if(/[0-9]/.test(k)){
      if(fresh || cur === '0'){ cur = k; fresh = false; }
      else if(cur.length < 14) cur += k;
    }
    else if(k === '.'){ if(cur.indexOf('.') === -1) cur += '.'; fresh = false; }
    else if(k === 'C'){ cur = '0'; prev = null; op = null; outEl.textContent = ''; fresh = true; }
    else if(k === '±'){ cur = String(-(+cur)); }
    else if(k === '%'){ cur = String(+cur / 100); }
    else if(k === '='){
      if(op !== null && prev !== null){
        const r = calc(prev, cur, op);
        outEl.textContent = prev + ' ' + op + ' ' + cur + ' =';
        if(isNaN(r) || !isFinite(r)){ Snd.error(); cur = 'Ошибка'; }
        else cur = String(Math.round(r * 1e10) / 1e10);
        prev = null; op = null; fresh = true;
      }
    }
    else {
      if(op !== null && !fresh){
        const r = calc(prev, cur, op);
        cur = String(Math.round(r * 1e10) / 1e10);
      }
      prev = cur; op = k; fresh = true;
      outEl.textContent = prev + ' ' + op;
    }
    upd();
  });
}

function buildTerminal(body){

    d.textContent = t;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }
  print('Windows 12 Terminal [Версия 12.0.26100]');
  print('(c) Корпорация Майкрософт. Все права защищены.');
  print('Введите "help" для списка команд.');
  print('');

  inp.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    const cmd = inp.value.trim();
    inp.value = '';
    print('C:\\Users\\Admin> ' + cmd, '#7ee787');
    if(!cmd) return;
    const parts = cmd.toLowerCase().split(' ');
    const c = parts[0], args = parts.slice(1);
    switch(c){
      case 'help':
        print('Доступные команды:');
        print('  help    — этот список');
        print('  dir     — содержимое папки');
        print('  cls     — очистить экран');
        print('  echo    — вывести текст');
        print('  date    — текущая дата');
        print('  whoami  — текущий пользователь');
        print('  ver     — версия системы');
        print('  sound   — проверить звук');
        print('  exit    — закрыть терминал');
        break;
      case 'dir':
        print(' Содержимое папки C:\\Users\\Admin');
        print('');
        print('  <DIR>   Рабочий стол');
        print('  <DIR>   Документы');
        print('  <DIR>   Загрузки');
        print('  <DIR>   Изображения');
        print('  <DIR>   Музыка');
        print('  <DIR>   Видео');
        break;
      case 'cls': out.innerHTML = ''; break;
      case 'echo': print(args.join(' ')); break;
      case 'date': print(new Date().toLocaleString('ru-RU')); break;
      case 'whoami': print('desktop-12\\admin'); break;
      case 'ver': print('Microsoft Windows 12 Pro [Версия 12.0.26100]'); break;
      case 'sound': print('Воспроизведение тестового звука…', '#8fd9ff'); Snd.startup(); break;
      case 'exit': {
        const r = WM.wins.get('terminal');
        if(r){ Snd.close(); r.el.classList.add('closing');
          setTimeout(() => { r.el.remove(); WM.wins.delete('terminal'); WM.updateTaskbar(); }, 190); }

      }
      default:
        print('"' + cmd + '" не является внутренней или внешней командой.', '#ff7b72');
        Snd.error();
    }
    print('');
  });

  // на iPad поле ввода фокусируем по тапу
  body.addEventListener('click', () => { setTimeout(() => inp.focus(), 50); });
  setTimeout(() => { try{ inp.focus(); }catch(e){} }, 200);
}

const ctxEl = document.getElementById('ctx');
let ctxActions = [];

function showCtx(x, y, items){
  ctxActions = [];
  ctxEl.innerHTML = items.map(it => {
    if(it.sep) return '<div class="ctx-sep"></div>';
    ctxActions.push(it.fn || null);
    return '<div class="ctx-item" data-i="' + (ctxActions.length - 1) + '">' +
             '<span>' + (it.e || '') + '</span><span>' + it.t + '</span></div>';
  }).join('');

  ctxEl.classList.add('on');
  const w = ctxEl.offsetWidth, h = ctxEl.offsetHeight;
  ctxEl.style.left = Math.min(x, innerWidth - w - 12) + 'px';
  ctxEl.style.top  = Math.min(y, innerHeight - h - 12) + 'px';

  ctxEl.querySelectorAll('.ctx-item').forEach(el => {
    el.addEventListener('click', () => {
      Snd.click();
      hideCtx();
      const fn = ctxActions[+el.dataset.i];
      if(typeof fn === 'function') fn();
    });
  });
}
function hideCtx(){ ctxEl.classList.remove('on'); }

document.addEventListener('pointerdown', e => {
  if(!ctxEl.contains(e.target)) hideCtx();
}, {passive:true});

// фон рабочего стола: тап = снять выделение, долгое нажатие = меню
const deskEl = document.getElementById('desk');
onTap(deskEl, () => {
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  document.querySelectorAll('.dicon').forEach(x => x.classList.remove('sel'));
  hideCtx();
}, {
  long:e => {
    if(e.target.closest('.dicon')) return;
    Snd.click();
    showCtx(e.clientX, e.clientY, [
      { a:'refresh', e:'🔄', t:'Обновить', fn:() => toast('Рабочий стол обновлён', '🔄') },
      { sep:true },
      { a:'newfolder', e:'📁', t:'Создать папку', fn:() => toast('Папка «Новая папка» создана', '📁') },
      { a:'explorer', e:'📂', t:'Открыть проводник', fn:() => WM.open('explorer') },
      { a:'terminal', e:'⌨️', t:'Открыть терминал', fn:() => WM.open('terminal') },
      { sep:true },
      { a:'personalize', e:'🎨', t:'Персонализация', fn:() => WM.open('settings') },
      { a:'about', e:'ℹ️', t:'О системе', fn:() => WM.open('about') }
    ]);
  }
});

// для мыши (на Mac/ПК с iPad-эмуляцией) оставляем правую кнопку
deskEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  if(e.target.closest('.dicon')) return;
  Snd.click();
  showCtx(e.clientX, e.clientY, [
    { a:'refresh', e:'🔄', t:'Обновить', fn:() => toast('Рабочий стол обновлён', '🔄') },
    { sep:true },
    { a:'explorer', e:'📂', t:'Открыть проводник', fn:() => WM.open('explorer') },
    { a:'personalize', e:'🎨', t:'Персонализация', fn:() => WM.open('settings') }
  ]);
});

/* ============================================================
   ПАНЕЛЬ ЗАДАЧ / ПУСК
   ============================================================ */
const startMenu = document.getElementById('start');
const startBtn = document.getElementById('startBtn');

function toggleStart(force){
  const on = force !== undefined ? force : !startMenu.classList.contains('on');
  startMenu.classList.toggle('on', on);
  startBtn.classList.toggle('active', on);
  if(on) Snd.open(); else Snd.close();
}

startBtn.addEventListener('click', e => {
  e.stopPropagation();
  toggleStart();
});

document.addEventListener('pointerdown', e => {
  if(startMenu.classList.contains('on') &&
     !startMenu.contains(e.target) && !startBtn.contains(e.target)){
    toggleStart(false);
  }
}, {passive:true});

document.querySelectorAll('.tb-btn[data-app]').forEach(b => {
  b.addEventListener('click', () => WM.open(b.dataset.app));
});

/* --- меню Пуск --- */
const PINNED = [
  { n:'Проводник',   e:'📁', a:'explorer' },
  { n:'Блокнот',     e:'📝', a:'notepad' },
  { n:'Калькулятор', e:'🧮', a:'calc' },
  { n:'Терминал',    e:'⌨️', a:'terminal' },
  { n:'Параметры',   e:'⚙️', a:'settings' },
  { n:'О системе',   e:'ℹ️', a:'about' }
];
const RECENT = [
  { e:'📄', n:'Идеи.txt', s:'Рабочий стол', a:'notepad' },
  { e:'📝', n:'Заметки.md', s:'Документы', a:'notepad' },
  { e:'📊', n:'Отчёт 2026.xlsx', s:'Документы', a:'explorer' },
  { e:'🖼️', n:'wallpaper.png', s:'Изображения', a:'explorer' },
  { e:'🎵', n:'playlist.mp3', s:'Музыка', a:'explorer' },
  { e:'🎬', n:'windows12-concept.mp4', s:'Видео', a:'explorer' }
];

function renderStart(){
  document.getElementById('smGrid').innerHTML = PINNED.map(p =>
    '<div class="sm-app" data-a="'+p.a+'"><span class="e">'+p.e+'</span><span>'+p.n+'</span></div>'
  ).join('');
  document.querySelectorAll('.sm-app').forEach(el => {
    onTap(el, () => { WM.open(el.dataset.a); toggleStart(false); });
  });

  document.getElementById('smRec').innerHTML = RECENT.map(r =>
    '<div class="sm-rec-item" data-a="'+r.a+'">'+
      '<span class="e">'+r.e+'</span>'+
      '<div><div>'+r.n+'</div><small>'+r.s+'</small></div>'+
    '</div>'
  ).join('');
  document.querySelectorAll('.sm-rec-item').forEach(el => {
    onTap(el, () => { WM.open(el.dataset.a); toggleStart(false); });
  });
}

document.getElementById('smSearch').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.sm-app').forEach(el => {
    el.style.display = el.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
  });
});

document.getElementById('smPower').addEventListener('click', () => {
  Snd.lockSound();
  toggleStart(false);
  hideCtx();
  document.getElementById('shutdown').classList.add('on');
  setTimeout(() => {
    document.getElementById('shutdown').classList.remove('on');
    document.querySelectorAll('.win').forEach(w => w.remove());
    WM.wins.clear(); WM.updateTaskbar();
    document.getElementById('desk').classList.remove('on');
    document.getElementById('taskbar').classList.remove('on');
    document.getElementById('lock').classList.remove('gone');
  }, 1800);
});

/* трей: звук */
document.getElementById('traySound').addEventListener('click', () => {
  Snd.enabled = !Snd.enabled;
  document.getElementById('traySound').textContent = Snd.enabled ? '🔊' : '🔇';
  if(Snd.enabled) Snd.click();
  toast(Snd.enabled ? 'Звук включён' : 'Звук выключен', Snd.enabled ? '🔊' : '🔇');
});

/* ============================================================
   ЧАСЫ
   ============================================================ */
function tickClock(){
  const d = new Date();
  const hm = d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('clkTime').textContent = hm;
  document.getElementById('clkDate').textContent = d.toLocaleDateString('ru-RU');
  document.getElementById('lockTime').textContent = hm;
  document.getElementById('lockDate').textContent =
    d.toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
setInterval(tickClock, 1000);
tickClock();

/* ============================================================
   СТАРТ СИСТЕМЫ
   ============================================================ */
renderIcons();
renderStart();

setTimeout(() => document.getElementById('boot').classList.add('gone'), 2600);

let entered = false;
function enterSystem(){
  if(entered) return;
  entered = true;
  Snd.init();
  document.getElementById('lock').classList.add('gone');
  Snd.startup();
  setTimeout(() => {
    document.getElementById('desk').classList.add('on');
    document.getElementById('taskbar').classList.add('on');
  }, 350);
  setTimeout(() => toast('Добро пожаловать в Windows 12!', '👋'), 2200);
}
document.getElementById('lock').addEventListener('pointerup', enterSystem);
document.getElementById('lock').addEventListener('click', enterSystem);

/* защита от случайного зума и скролла страницы */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
window.addEventListener('touchmove', e => {
  // разрешаем скролл только внутри контейнеров с touch-action: pan-y
  if(!e.target.closest('.exp-content, .exp-side, .term, .set-main, .sm-rec, textarea, .crumbs')){
    if(e.cancelable) e.preventDefault();
  }
}, {passive:false});

/* Escape / Ctrl+Esc на клавиатуре, подключённой к iPad */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    hideCtx();
    if(startMenu.classList.contains('on')) toggleStart(false);
  }
  if(e.ctrlKey && e.key === 'Escape'){ e.preventDefault(); toggleStart(); }
});
</script>
</body>

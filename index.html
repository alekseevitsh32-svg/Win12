<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows 12</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#4cc2ff;
  --accent2:#7c5cff;
  --glass:rgba(30,30,36,.72);
  --glass2:rgba(44,44,52,.8);
  --stroke:rgba(255,255,255,.09);
  --txt:#f2f4f8;
  --txt2:#a8adb8;
  --hover:rgba(255,255,255,.07);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif;
  background:#04050a;color:var(--txt);
  user-select:none;-webkit-font-smoothing:antialiased;
}
input,textarea{user-select:text;font-family:inherit}

/* ============ ОБОИ ============ */
#wall{position:fixed;inset:0;overflow:hidden;background:#04050a;z-index:0}
#wall::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,transparent 30%,rgba(0,0,0,.55) 100%);
  pointer-events:none;
}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s ease-in-out infinite}
.b1{width:52vw;height:52vw;left:-12vw;top:-14vw;background:#1f56c9;animation-delay:0s}
.b2{width:46vw;height:46vw;right:-10vw;top:6vh;background:#7b2ff7;animation-delay:-8s}
.b3{width:44vw;height:44vw;left:22vw;bottom:-18vw;background:#00b8d4;animation-delay:-15s}
.b4{width:30vw;height:30vw;right:14vw;bottom:2vh;background:#ff3d81;opacity:.28;animation-delay:-5s}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(6vw,4vh) scale(1.12)}
  66%{transform:translate(-5vw,-3vh) scale(.92)}
}
#wallGrid{position:absolute;inset:0;opacity:.16;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 78%)}

/* ============ ЗАГРУЗКА ============ */
#boot{position:fixed;inset:0;background:#000;z-index:9000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:44px;transition:opacity .7s}
#boot.gone{opacity:0;pointer-events:none}
.logo4{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:74px;height:74px;
  filter:drop-shadow(0 0 22px rgba(76,194,255,.55));animation:logoIn 1.2s cubic-bezier(.2,.9,.3,1)}
.logo4 div{background:linear-gradient(135deg,#8fe0ff,#4cc2ff);border-radius:3px}
@keyframes logoIn{from{opacity:0;transform:scale(.5) rotate(-25deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.13);border-top-color:#4cc2ff;
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bootText{position:absolute;bottom:70px;color:#5c6270;font-size:13px;letter-spacing:.5px}

/* ============ ЭКРАН ВХОДА ============ */
#lock{position:fixed;inset:0;z-index:8500;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;cursor:pointer;
  transition:opacity .6s,transform .6s;
  background:linear-gradient(160deg,#0b1226,#1a0f2e 50%,#06121c)}
#lock.gone{opacity:0;transform:scale(1.08);pointer-events:none}
#lockTime{font-size:104px;font-weight:200;letter-spacing:-3px;text-shadow:0 6px 40px rgba(0,0,0,.6)}
#lockDate{font-size:20px;color:#b9c0cf;margin-top:-8px}
#lockHint{margin-top:70px;padding:12px 26px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);font-size:14px;color:#dfe4ee;
  animation:pulseHint 2.4s ease-in-out infinite}
@keyframes pulseHint{0%,100%{opacity:.65}50%{opacity:1}}
#lockUser{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:-20px}
.avatarBig{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  font-size:44px;font-weight:600;background:linear-gradient(135deg,#4cc2ff,#7c5cff);
  box-shadow:0 14px 50px rgba(76,194,255,.4)}

/* ============ РАБОЧИЙ СТОЛ ============ */
#desk{position:fixed;inset:0;z-index:10;opacity:0;transition:opacity .8s}
#desk.on{opacity:1}

#icons{position:absolute;top:14px;left:14px;display:grid;grid-template-columns:repeat(auto-fill,92px);
  grid-auto-flow:column;grid-template-rows:repeat(7,96px);gap:2px;z-index:11}
.dicon{width:92px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;border-radius:8px;cursor:default;font-size:11.5px;text-align:center;padding:6px 4px;
  transition:background .12s;border:1px solid transparent}
.dicon:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.08)}
.dicon.sel{background:rgba(76,194,255,.22);border-color:rgba(76,194,255,.5)}
.dicon span:first-child{font-size:34px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.dicon span:last-child{text-shadow:0 1px 4px rgba(0,0,0,.9);line-height:1.2;
  max-width:88px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ============ ОКНА ============ */
.win{position:fixed;background:var(--glass);backdrop-filter:blur(34px) saturate(1.6);
  border:1px solid var(--stroke);border-radius:12px;display:flex;flex-direction:column;
  box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05) inset;
  overflow:hidden;animation:winIn .26s cubic-bezier(.2,.9,.3,1);
  min-width:320px;min-height:220px}
@keyframes winIn{from{opacity:0;transform:scale(.93) translateY(14px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .2s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.94) translateY(10px)}}
.win.max{border-radius:0!important}
.win.minimized{display:none}
.win-tb{height:38px;display:flex;align-items:center;justify-content:space-between;
  padding-left:14px;cursor:default;flex:0 0 38px;background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,255,255,.06)}
.win-tt{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#dde2ec;font-weight:500}
.win-tt .ico{font-size:15px}
.win-ctrls{display:flex;height:100%}
.win-ctrls button{width:46px;height:100%;border:0;background:transparent;color:#cfd5e0;
  font-size:13px;cursor:pointer;transition:background .12s;display:grid;place-items:center}
.win-ctrls button:hover{background:rgba(255,255,255,.1)}
.win-ctrls button[data-a="close"]:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.win-res{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}

/* ============ ПРОВОДНИК ============ */
.exp{display:flex;flex-direction:column;height:100%;font-size:13px}
.exp-tb{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.nav-btn{width:30px;height:30px;border-radius:6px;border:0;background:transparent;color:#cfd5e0;
  cursor:pointer;font-size:16px;transition:background .12s}
.nav-btn:hover{background:var(--hover)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn:disabled:hover{background:transparent}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);border-radius:6px;padding:3px 8px;height:30px;overflow:hidden}
.crumb{padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;color:#cfd5e0}
.crumb:hover{background:rgba(255,255,255,.1)}
.crumb-sep{color:#6b7280;font-size:11px}
.exp-search input{width:170px;height:30px;border-radius:6px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);color:var(--txt);padding:0 10px;font-size:12.5px;outline:none}
.exp-search input:focus{border-color:var(--accent)}
.exp-main{flex:1;display:flex;overflow:hidden}
.exp-side{width:186px;flex:0 0 186px;padding:8px 6px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
.side-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;cursor:pointer;
  color:#c3c9d6;font-size:12.5px;transition:background .12s}
.side-item:hover{background:var(--hover)}
.side-item.active{background:rgba(76,194,255,.18);color:#fff}
.side-item .e{font-size:15px}
.exp-content{flex:1;overflow-y:auto;padding:12px;align-content:start;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:8px;
  cursor:default;font-size:11.5px;text-align:center;border:1px solid transparent;transition:background .12s}
.tile:hover{background:var(--hover)}
.tile.sel{background:rgba(76,194,255,.2);border-color:rgba(76,194,255,.45)}
.tile .e{font-size:36px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.tile .n{max-width:96px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.exp-status{height:26px;flex:0 0 26px;display:flex;align-items:center;padding:0 12px;font-size:11.5px;
  color:var(--txt2);border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.15)}
.empty-msg{grid-column:1/-1;text-align:center;color:#7a8290;padding:40px 0;font-size:13px}

/* ============ БЛОКНОТ ============ */
.np{display:flex;flex-direction:column;height:100%}
.np-menu{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}
.np-menu span{padding:4px 10px;border-radius:5px;cursor:pointer;color:#c3c9d6}
.np-menu span:hover{background:var(--hover)}
.np textarea{flex:1;background:rgba(0,0,0,.25);border:0;outline:none;color:#e8ecf4;
  padding:14px 16px;font-size:14px;resize:none;line-height:1.6;font-family:'Cascadia Code',Consolas,monospace}

/* ============ КАЛЬКУЛЯТОР ============ */
.calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px;background:rgba(0,0,0,.18)}
.calc-out{text-align:right;padding:14px 12px 6px;font-size:15px;color:#8b93a3;min-height:22px;overflow:hidden}
.calc-main{text-align:right;padding:0 12px 10px;font-size:42px;font-weight:300;overflow:hidden;
  text-overflow:ellipsis;line-height:1.1}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-grid button{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.06);
  color:#eef2f8;border-radius:8px;font-size:17px;cursor:pointer;transition:.12s;font-family:inherit}
.calc-grid button:hover{background:rgba(255,255,255,.14)}
.calc-grid button:active{transform:scale(.96)}
.calc-grid .op{background:rgba(76,194,255,.16);color:#8fd9ff}
.calc-grid .eq{background:linear-gradient(135deg,#4cc2ff,#2f8fd6);color:#001a2b;font-weight:600}
.calc-grid .fn{background:rgba(255,255,255,.03);color:#a9b2c2;font-size:15px}

/* ============ ПАРАМЕТРЫ ============ */
.set{display:flex;height:100%;font-size:13px}
.set-side{width:190px;flex:0 0 190px;padding:14px 8px;border-right:1px solid rgba(255,255,255,.06)}
.set-main{flex:1;overflow-y:auto;padding:18px 22px}
.set-title{font-size:20px;font-weight:600;margin-bottom:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
  background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:8px;margin-bottom:9px}
.set-row small{display:block;color:var(--txt2);font-size:11.5px;margin-top:2px}
.sw{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.15);position:relative;
  cursor:pointer;transition:.2s;flex:0 0 44px}
.sw::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:.2s}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
.wp-row{display:flex;gap:10px;margin-top:6px}
.wp{width:74px;height:48px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:.15s}
.wp:hover{transform:translateY(-2px)}
.wp.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,194,255,.25)}
input[type=range]{width:170px;accent-color:var(--accent)}

/* ============ ТЕРМИНАЛ ============ */
.term{flex:1;background:rgba(6,8,14,.85);padding:12px 14px;overflow-y:auto;
  font-family:'Cascadia Code',Consolas,monospace;font-size:13px;line-height:1.55;color:#c9f7c0}
.term-in{display:flex;gap:6px;padding:0 14px 12px;background:rgba(6,8,14,.85)}
.term-in span{color:#7ee787;font-family:Consolas,monospace;font-size:13px}
.term-in input{flex:1;background:transparent;border:0;outline:none;color:#e8ffdf;
  font-family:Consolas,monospace;font-size:13px}

/* ============ ПАНЕЛЬ ЗАДАЧ ============ */
#taskbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%) translateY(110px);
  display:flex;align-items:center;gap:8px;z-index:5000;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
#taskbar.on{transform:translateX(-50%) translateY(0)}
.tb-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(34px) saturate(1.7);
  border:1px solid var(--stroke);box-shadow:0 20px 50px rgba(0,0,0,.55)}
.tb-btn{width:46px;height:44px;border-radius:10px;border:0;background:transparent;color:#dde2ec;
  font-size:21px;cursor:pointer;display:grid;place-items:center;transition:background .14s,transform .14s;position:relative}
.tb-btn:hover{background:rgba(255,255,255,.1)}
.tb-btn:active{transform:scale(.93)}
.tb-btn.running::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.tb-btn.active{background:rgba(255,255,255,.13)}
.tb-btn.active::after{width:16px;border-radius:3px}
.start-btn{position:relative}
.start-logo{display:grid;grid-template-columns:1fr 1fr;gap:2.5px;width:20px;height:20px}
.start-logo i{background:linear-gradient(135deg,#9be4ff,#4cc2ff);border-radius:1.5px}
.tb-tray{display:flex;align-items:center;gap:10px;padding:0 14px;height:56px;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(34px) saturate(1.7);border:1px solid var(--stroke);
  box-shadow:0 20px 50px rgba(0,0,0,.55);font-size:14px}
.tray-ico{cursor:pointer;opacity:.85;transition:opacity .12s,transform .12s;font-size:15px}
.tray-ico:hover{opacity:1;transform:scale(1.15)}
.clock{text-align:right;font-size:11.5px;line-height:1.35;cursor:pointer;padding-left:6px;
  border-left:1px solid rgba(255,255,255,.1)}
#clkTime{font-size:13px}

/* ============ ПУСК ============ */
#start{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(24px) scale(.97);
  width:600px;max-width:calc(100vw - 32px);height:600px;max-height:calc(100vh - 120px);
  background:var(--glass);backdrop-filter:blur(40px) saturate(1.7);
  border:1px solid var(--stroke);border-radius:18px;z-index:5200;
  box-shadow:0 40px 100px rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;display:flex;flex-direction:column;padding:22px}
#start.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.sm-search{margin-bottom:16px}
.sm-search input{width:100%;height:38px;border-radius:999px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.06);color:var(--txt);padding:0 18px;font-size:13.5px;outline:none}
.sm-search input:focus{border-color:var(--accent);background:rgba(255,255,255,.09)}
.sm-label{font-size:12px;color:var(--txt2);margin:6px 4px 10px;font-weight:600}
.sm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:9px;
  cursor:pointer;font-size:11px;text-align:center;transition:background .12s}
.sm-app:hover{background:rgba(255,255,255,.09)}
.sm-app .e{font-size:29px}
.sm-rec{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
.sm-rec-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;cursor:pointer;
  font-size:12.5px;transition:background .12s}
.sm-rec-item:hover{background:rgba(255,255,255,.09)}
.sm-rec-item .e{font-size:22px}
.sm-rec-item small{display:block;color:var(--txt2);font-size:11px}
.sm-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.sm-user{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer}
.sm-user:hover{background:rgba(255,255,255,.08)}
.avatarSm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;
  font-weight:600;background:linear-gradient(135deg,#4cc2ff,#7c5cff)}
.sm-power{width:38px;height:38px;border-radius:8px;border:0;background:transparent;color:#cfd5e0;
  font-size:17px;cursor:pointer;transition:background .12s}
.sm-power:hover{background:rgba(232,17,35,.7);color:#fff}

/* ============ КОНТЕКСТНОЕ МЕНЮ ============ */
#ctx{position:fixed;z-index:6000;min-width:200px;padding:6px;border-radius:10px;
  background:var(--glass2);backdrop-filter:blur(34px) saturate(1.6);
  border:1px solid var(--stroke);box-shadow:0 22px 60px rgba(0,0,0,.65);
  opacity:0;pointer-events:none;transform:scale(.96);transition:.13s;transform-origin:top left}
#ctx.on{opacity:1;pointer-events:auto;transform:scale(1)}
.ctx-item{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:6px;
  font-size:12.5px;cursor:pointer;color:#dde2ec}
.ctx-item:hover{background:rgba(255,255,255,.1)}
.ctx-sep{height:1px;background:rgba(255,255,255,.1);margin:5px 8px}

/* ============ УВЕДОМЛЕНИЯ ============ */
#toasts{position:fixed;right:16px;bottom:96px;z-index:7000;display:flex;flex-direction:column;
  gap:9px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:11px;padding:12px 18px;border-radius:11px;
  background:var(--glass2);backdrop-filter:blur(30px);border:1px solid var(--stroke);
  box-shadow:0 18px 44px rgba(0,0,0,.6);font-size:13px;animation:toastIn .32s cubic-bezier(.2,.9,.3,1);
  max-width:330px}
.toast.out{animation:toastOut .32s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(60px)}}

/* ============ ВЫКЛЮЧЕНИЕ ============ */
#shutdown{position:fixed;inset:0;background:#000;z-index:9500;opacity:0;pointer-events:none;
  display:grid;place-items:center;transition:opacity .8s;font-size:14px;color:#4a505c;letter-spacing:1px}
#shutdown.on{opacity:1;pointer-events:auto}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<!-- ОБОИ -->
<div id="wall">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>
  <div id="wallGrid"></div>
</div>

<!-- ЗАГРУЗКА -->
<div id="boot">
  <div class="logo4"><div></div><div></div><div></div><div></div></div>
  <div class="spinner"></div>
  <div id="bootText">Запуск Windows 12…</div>
</div>

<!-- ЭКРАН ВХОДА -->
<div id="lock">
  <div id="lockTime">00:00</div>
  <div id="lockDate">1 января 2026 г.</div>
  <div id="lockUser">
    <div class="avatarBig">А</div>
    <div style="font-size:17px">Администратор</div>
  </div>
  <div id="lockHint">Нажмите, чтобы войти</div>
</div>

<!-- РАБОЧИЙ СТОЛ -->
<div id="desk">
  <div id="icons"></div>
</div>

<!-- ПАНЕЛЬ ЗАДАЧ -->
<div id="taskbar">
  <div class="tb-bar">
    <button class="tb-btn start-btn" id="startBtn" title="Пуск">
      <span class="start-logo"><i></i><i></i><i></i><i></i></span>
    </button>

<script>
/* ============================================================
   ЗВУКОВОЙ ДВИЖОК (Web Audio API)
   ============================================================ */
const Snd = {
  ctx: null, enabled: true, volume: 0.55,
  init(){
    if(!this.ctx){
      try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, o = {}){
    if(!this.enabled || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t + dur);
    const vol = Math.max(0.0002, (o.vol || 0.08) * this.volume);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.06);
  },
  noise(dur = 0.15, vol = 0.05){
    if(!this.enabled || !this.ctx) return;
    const c = this.ctx, n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol * this.volume;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.8;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  },
  click(){ this.tone(1750, 0.045, {type:'triangle', vol:0.045}); this.noise(0.04, 0.02); },
  hover(){ this.tone(2600, 0.018, {type:'sine', vol:0.012}); },
  open(){ this.tone(420, 0.16, {type:'sine', vol:0.07, glide:880}); this.tone(880, 0.1, {type:'sine', vol:0.03, delay:0.05}); },
  close(){ this.tone(760, 0.15, {type:'sine', vol:0.06, glide:300}); },
  minimize(){ this.tone(900, 0.12, {type:'sine', vol:0.05, glide:420}); },
  maximize(){ this.tone(420, 0.13, {type:'sine', vol:0.05, glide:1000}); },
  error(){ this.tone(200, 0.16, {type:'square', vol:0.05}); this.tone(150, 0.22, {type:'square', vol:0.05, delay:0.14}); },
  notify(){ this.tone(1046, 0.1, {type:'sine', vol:0.05}); this.tone(1568, 0.14, {type:'sine', vol:0.045, delay:0.09}); },
  nav(){ this.tone(1200, 0.05, {type:'sine', vol:0.035}); },
  lockSound(){ this.tone(660, 0.2, {type:'sine', vol:0.05, glide:440}); this.tone(440, 0.35, {type:'sine', vol:0.04, delay:0.15}); },
  startup(){
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
    notes.forEach((f, i) => this.tone(f, 1.3, {type:'sine', vol:0.055, delay:i * 0.085, attack:0.03}));
    this.tone(130.81, 2.4, {type:'sine', vol:0.06, attack:0.15});
    this.tone(196.00, 2.2, {type:'sine', vol:0.045, delay:0.06, attack:0.15});
    this.tone(261.63, 2.0, {type:'sine', vol:0.04, delay:0.12, attack:0.15});
    [1568, 2093, 2637].forEach((f, i) =>
      this.tone(f, 0.6, {type:'triangle', vol:0.018, delay:0.55 + i * 0.11}));
  }
};

/* ============================================================

   ============================================================ */
const FS = {
  name: 'Этот компьютер', type: 'folder', children: [
    { name: 'Рабочий стол', type: 'folder', children: [
      { name: 'Проекты', type: 'folder', children: [

        { name: 'style.css', type: 'file', ext: 'css', size: '12 КБ',

        { name: 'app.js', type: 'file', ext: 'js', size: '31 КБ',
          content: 'const Snd = { ... };\nconsole.log("Windows 12 ready");' }
      ]},
      { name: 'Идеи.txt', type: 'file', ext: 'txt', size: '2 КБ',

function getNode(path){
  let n = FS;
  for(let i = 1; i < path.length; i++){
    if(!n.children) return null;
    const next = n.children.find(c => c.name === path[i]);
    if(!next) return null;
    n = next;
  }
  return n;
}
const EXT_ICON = { html:'📄', css:'🎨', js:'📜', txt:'📃', md:'📝', png:'🖼️', jpg:'🖼️',
  mp3:'🎵', mp4:'🎬', exe:'⚙️', xlsx:'📊', docx:'📘', pdf:'📕', zip:'🗜️' };
function iconFor(node){
  if(node.type === 'folder') return '📁';
  return EXT_ICON[(node.ext || '').toLowerCase()] || '📄';
}

/* ============================================================
   МЕНЕДЖЕР ОКОН
   ============================================================ */
const WM = {
  z: 100,
  wins: new Map(),
  open(appId){
    const app = APPS[appId];
    if(!app) return;
    const existing = this.wins.get(appId);
    if(existing){
      if(existing.el.classList.contains('minimized')){
        existing.el.classList.remove('minimized');
        Snd.open();
      } else {
        this.focus(appId);
        Snd.click();
      }
      this.updateTaskbar();
      return;
    }
    const el = document.createElement('div');
    el.className = 'win';
    const w = Math.min(app.w, innerWidth - 60);
    const h = Math.min(app.h, innerHeight - 150);
    const x = Math.max(20, Math.round((innerWidth - w) / 2 + (Math.random() * 70 - 35)));
    const y = Math.max(16, Math.round((innerHeight - h) / 2 - 70 + (Math.random() * 50 - 25)));
    el.style.cssText = `width:${w}px;height:${h}px;left:${x}px;top:${y}px;z-index:${++this.z}`;
    el.innerHTML = `
      <div class="win-tb">
        <div class="win-tt"><span class="ico">${app.icon}</span><span>${app.title}</span></div>
        <div class="win-ctrls">
          <button data-a="min" title="Свернуть">–</button>
          <button data-a="max" title="Развернуть">□</button>
          <button data-a="close" title="Закрыть">✕</button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="win-res"></div>`;
    document.body.appendChild(el);

    const rec = { el, appId, maximized: false, prev: null };
    this.wins.set(appId, rec);

    el.addEventListener('mousedown', () => this.focus(appId));
    el.querySelector('.win-ctrls').addEventListener('click', e => {
      const a = e.target.dataset.a;
      if(!a) return;
      e.stopPropagation();
      if(a === 'close'){ Snd.close(); el.classList.add('closing');
        setTimeout(() => { el.remove(); this.wins.delete(appId); this.updateTaskbar(); }, 190);
      }
      if(a === 'min'){ Snd.minimize(); el.classList.add('minimized'); this.updateTaskbar(); }
      if(a === 'max'){ Snd.maximize(); this.toggleMax(appId); }
    });

    this.makeDraggable(el, appId);
    this.makeResizable(el, appId);
    app.build(el.querySelector('.win-body'));
    Snd.open();
    this.updateTaskbar();
  },
  toggleMax(appId){
    const r = this.wins.get(appId); if(!r) return;
    const el = r.el;
    if(!r.maximized){
      r.prev = { w: el.style.width, h: el.style.height, l: el.style.left, t: el.style.top };
      el.style.left = '0px'; el.style.top = '0px';
      el.style.width = '100vw'; el.style.height = 'calc(100vh - 0px)';
      el.classList.add('max'); r.maximized = true;
    } else {
      Object.assign(el.style, { width: r.prev.w, height: r.prev.h, left: r.prev.l, top: r.prev.t });
      el.classList.remove('max'); r.maximized = false;
    }
  },
  focus(appId){
    const r = this.wins.get(appId); if(!r) return;
    r.el.style.zIndex = ++this.z;
    this.updateTaskbar();
  },
  updateTaskbar(){
    document.querySelectorAll('.tb-btn[data-app]').forEach(b => {
      const on = this.wins.has(b.dataset.app);
      b.classList.toggle('running', on);
      const r = this.wins.get(b.dataset.app);
      b.classList.toggle('active', !!r && !r.el.classList.contains('minimized') &&
        r.el.style.zIndex == this.z);
    });
  },
  makeDraggable(el, appId){
    const tb = el.querySelector('.win-tb');
    let sx, sy, ox, oy, dragging = false;
    tb.addEventListener('mousedown', e => {
      if(e.target.closest('.win-ctrls')) return;
      const r = this.wins.get(appId);
      if(r && r.maximized) return;
      dragging = true;
      sx = e.clientX; sy = e.clientY;
      ox = el.offsetLeft; oy = el.offsetTop;
      el.style.transition = 'none';
      document.body.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', e => {
      if(!dragging) return;
      let nx = ox + e.clientX - sx, ny = oy + e.clientY - sy;
      nx = Math.max(-el.offsetWidth + 120, Math.min(nx, innerWidth - 120));
      ny = Math.max(0, Math.min(ny, innerHeight - 90));
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
    });
    window.addEventListener('mouseup', () => {
      if(dragging){ dragging = false; document.body.style.cursor = ''; }
    });
  },
  makeResizable(el, appId){
    const h = el.querySelector('.win-res');
    let sx, sy, sw, sh, on = false;
    h.addEventListener('mousedown', e => {
      e.stopPropagation(); on = true;
      const r = this.wins.get(appId);
      if(r && r.maximized) return;
      sx = e.clientX; sy = e.clientY;
      sw = el.offsetWidth; sh = el.offsetHeight;
    });
    window.addEventListener('mousemove', e => {
      if(!on) return;
      el.style.width = Math.max(320, sw + e.clientX - sx) + 'px';
      el.style.height = Math.max(220, sh + e.clientY - sy) + 'px';
    });
    window.addEventListener('mouseup', () => on = false);
  }
};

const APPS = {
  explorer: { title: 'Проводник', icon: '📁', w: 920, h: 580, build: buildExplorer },
  notepad:  { title: 'Блокнот',  icon: '📝', w: 660, h: 480, build: buildNotepad },
  calc:     { title: 'Калькулятор', icon: '🧮', w: 340, h: 540, build: buildCalc },

  about:    { title: 'О системе', icon: 'ℹ️', w: 480, h: 400, build: buildAbout }
};

/* ---------- ПРОВОДНИК ---------- */
let expPath = ['Этот компьютер'];
let expHist = [['Этот компьютер']];
let expHi = 0;

function buildExplorer(body){
  body.innerHTML = `
    <div class="exp">
      <div class="exp-tb">
        <button class="nav-btn" data-nav="back" title="Назад">‹</button>
        <button class="nav-btn" data-nav="fwd" title="Вперёд">›</button>
        <button class="nav-btn" data-nav="up" title="Вверх">↑</button>
        <div class="crumbs"></div>
        <div class="exp-search"><input placeholder="Поиск" id="expSearch"></div>
      </div>
      <div class="exp-main">
        <aside class="exp-side"></aside>
        <div class="exp-content" id="expContent"></div>
      </div>
      <div class="exp-status" id="expStatus"></div>
    </div>`;

  const sideItems = [
    { label: 'Рабочий стол', e: '🖥️', path: ['Этот компьютер', 'Рабочий стол'] },
    { label: 'Документы', e: '📄', path: ['Этот компьютер', 'Документы'] },
    { label: 'Загрузки', e: '⬇️', path: ['Этот компьютер', 'Загрузки'] },
    { label: 'Изображения', e: '🖼️', path: ['Этот компьютер', 'Изображения'] },
    { label: 'Музыка', e: '🎵', path: ['Этот компьютер', 'Музыка'] },
    { label: 'Видео', e: '🎬', path: ['Этот компьютер', 'Видео'] },
    { label: 'Этот компьютер', e: '💻', path: ['Этот компьютер'] }
  ];
  const side = body.querySelector('.exp-side');
  side.innerHTML = sideItems.map((it, i) =>
    `<div class="side-item" data-i="${i}"><span class="e">${it.e}</span><span>${it.label}</span></div>`
  ).join('');
  side.querySelectorAll('.side-item').forEach(el => {
    el.addEventListener('click', () => {
      Snd.nav();
      expNavigate(sideItems[+el.dataset.i].path);
    });
  });

  body.querySelector('.exp-tb').addEventListener('click', e => {
    const nav = e.target.dataset.nav;
    if(!nav) return;
    Snd.click();
    if(nav === 'back' && expHi > 0){ expHi--; expPath = expHist[expHi]; expRender(body); }
    if(nav === 'fwd' && expHi < expHist.length - 1){ expHi++; expPath = expHist[expHi]; expRender(body); }
    if(nav === 'up' && expPath.length > 1){ expNavigate(expPath.slice(0, -1)); }
  });

  body.querySelector('#expSearch').addEventListener('input', e => {
    expRender(body, e.target.value.toLowerCase());
  });

  expRender(body);
}

function expNavigate(path){
  expPath = path.slice();
  if(expHi < expHist.length - 1) expHist = expHist.slice(0, expHi + 1);
  expHist.push(expPath.slice()); expHi = expHist.length - 1;
  const w = WM.wins.get('explorer');
  if(w) expRender(w.el.querySelector('.win-body'));
}

function expRender(body, filter = ''){
  const node = getNode(expPath);
  if(!node) return;

  // хлебные крошки
  const crumbs = body.querySelector('.crumbs');
  crumbs.innerHTML = expPath.map((p, i) =>
    `<span class="crumb" data-i="${i}">${p}</span>` +
    (i < expPath.length - 1 ? '<span class="crumb-sep">›</span>' : '')
  ).join('');
  crumbs.querySelectorAll('.crumb').forEach(c => {
    c.addEventListener('click', () => { Snd.nav(); expNavigate(expPath.slice(0, +c.dataset.i + 1)); });
  });

  // навигация
  const btns = body.querySelectorAll('.nav-btn');
  btns[0].disabled = expHi <= 0;
  btns[1].disabled = expHi >= expHist.length - 1;
  btns[2].disabled = expPath.length <= 1;

  // сайдбар
  body.querySelectorAll('.side-item').forEach((el, i) => {
    const labels = ['Рабочий стол','Документы','Загрузки','Изображения','Музыка','Видео','Этот компьютер'];
    el.classList.toggle('active', expPath[expPath.length - 1] === labels[i] ||
      (i === 6 && expPath.length === 1));
  });

  // содержимое
  const cont = body.querySelector('#expContent');
  let items = (node.children || []).slice();
  if(filter) items = items.filter(c => c.name.toLowerCase().includes(filter));
  items.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'folder' ? -1 : 1));

  if(items.length === 0){
    cont.innerHTML = `<div class="empty-msg">${filter ? 'Ничего не найдено' : 'Эта папка пуста'}</div>`;
  } else {
    cont.innerHTML = items.map((it, i) =>
      `<div class="tile" data-i="${i}">
        <span class="e">${iconFor(it)}</span>
        <span class="n">${it.name}</span>
      </div>`).join('');
    cont.querySelectorAll('.tile').forEach(t => {
      const item = items[+t.dataset.i];
      t.addEventListener('click', () => {
        cont.querySelectorAll('.tile').forEach(x => x.classList.remove('sel'));
        t.classList.add('sel');
        Snd.click();
      });
      t.addEventListener('dblclick', () => {
        if(item.type === 'folder'){
          Snd.nav();
          expNavigate([...expPath, item.name]);
        } else if(item.content !== undefined){
          Snd.open();
          openInNotepad(item.name, item.content);
        } else {
          Snd.error();
          toast('Не удалось открыть «' + item.name + '»', '⚠️');
        }
      });
    });
  }
  body.querySelector('#expStatus').textContent =
    `${items.length} ${items.length === 1 ? 'элемент' : 'элементов'}  •  ${expPath.join(' \\ ')}`;
}

/* ---------- БЛОКНОТ ---------- */
let notepadEl = null;
function buildNotepad(body){
  body.innerHTML = `
    <div class="np">
      <div class="np-menu">
        <span data-a="new">Файл</span><span data-a="save">Сохранить</span>
        <span data-a="clear">Очистить</span><span data-a="sound">🔔</span>
      </div>
      <textarea id="npText" spellcheck="false" placeholder="Введите текст…"></textarea>
    </div>`;
  const ta = body.querySelector('#npText');
  notepadEl = ta;
  ta.addEventListener('keydown', e => {
    if(e.key.length === 1 && Math.random() < 0.18) Snd.tone(1400 + Math.random()*900, 0.014, {type:'sine', vol:0.012});
  });
  body.querySelector('.np-menu').addEventListener('click', e => {
    const a = e.target.dataset.a; if(!a) return;
    Snd.click();
    if(a === 'clear'){ ta.value = ''; }
    if(a === 'new'){ ta.value = ''; toast('Новый документ создан', '📝'); }
    if(a === 'save'){ Snd.notify(); toast('Файл сохранён', '💾'); }
    if(a === 'sound'){ Snd.notify(); }
  });
}
function openInNotepad(name, content){
  WM.open('notepad');
  const r = WM.wins.get('notepad');
  r.el.querySelector('.win-tt span:last-child').textContent = name + ' — Блокнот';
  setTimeout(() => {
    const ta = r.el.querySelector('#npText');
    if(ta) ta.value = content;
  }, 60);
}

/* ---------- КАЛЬКУЛЯТОР ---------- */
function buildCalc(body){
  body.innerHTML = `
    <div class="calc">
      <div class="calc-out" id="cOut"></div>
      <div class="calc-main" id="cMain">0</div>
      <div class="calc-grid">
        <button class="fn" data-k="C">C</button>
        <button class="fn" data-k="±">±</button>
        <button class="fn" data-k="%">%</button>
        <button class="op" data-k="/">÷</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="op" data-k="*">×</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button class="op" data-k="-">−</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button class="op" data-k="+">+</button>
        <button data-k="0" style="grid-column:span 2">0</button>
        <button data-k=".">,</button>
        <button class="eq" data-k="=">=</button>
      </div>
    </div>`;

  let cur = '0', prev = null, op = null, fresh = true;
  const mainEl = body.querySelector('#cMain');
  const outEl = body.querySelector('#cOut');
  const upd = () => { mainEl.textContent = cur; };

  function calc(a, b, o){
    a = +a; b = +b;
    if(o === '+') return a + b;
    if(o === '-') return a - b;
    if(o === '*') return a * b;
    if(o === '/') return b === 0 ? NaN : a / b;
    return b;
  }

  body.querySelector('.calc-grid').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    const k = b.dataset.k;
    Snd.tone(k === '=' ? 880 : 1500, 0.04, {type:'triangle', vol:0.045});

    if(/[0-9]/.test(k)){
      if(fresh || cur === '0'){ cur = k; fresh = false; }
      else if(cur.length < 14) cur += k;
    }
    else if(k === '.'){ if(!cur.includes('.')) cur += '.'; fresh = false; }
    else if(k === 'C'){ cur = '0'; prev = null; op = null; outEl.textContent = ''; fresh = true; }
    else if(k === '±'){ cur = String(-(+cur)); }
    else if(k === '%'){ cur = String(+cur / 100); }
    else if(k === '='){
      if(op !== null && prev !== null){
        const r = calc(prev, cur, op);
        outEl.textContent = `${prev} ${op} ${cur} =`;
        if(isNaN(r) || !isFinite(r)){ Snd.error(); cur = 'Ошибка'; }
        else cur = String(Math.round(r * 1e10) / 1e10);
        prev = null; op = null; fresh = true;
      }
    }
    else { // оператор
      if(op !== null && !fresh){
        const r = calc(prev, cur, op);
        cur = String(Math.round(r * 1e10) / 1e10);
      }
      prev = cur; op = k; fresh = true;
      outEl.textContent = `${prev} ${op}`;
    }
    upd();
  });
}

function buildTerminal(body){
  body.innerHTML = `
    <div class="term" id="termOut"></div>
    <div class="term-in"><span>C:\\Users\\Admin&gt;</span><input id="termIn" autocomplete="off" spellcheck="false"></div>`;
  const out = body.querySelector('#termOut');
  const inp = body.querySelector('#termIn');
  const print = (t, cls = '') => {
    const d = document.createElement('div');
    if(cls) d.style.color = cls;
    d.textContent = t;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  };
  print('Windows 12 Terminal [Версия 12.0.26100]');
  print('(c) Корпорация Майкрософт. Все права защищены.');
  print('Введите "help" для списка команд.');
  print('');

  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const cmd = inp.value.trim();
      inp.value = '';
      print('C:\\Users\\Admin> ' + cmd, '#7ee787');
      if(!cmd) return;
      const [c, ...args] = cmd.toLowerCase().split(' ');
      switch(c){
        case 'help':
          print('Доступные команды:');
          print('  help      — этот список');
          print('  dir       — содержимое папки');
          print('  cls       — очистить экран');
          print('  echo      — вывести текст');
          print('  date      — текущая дата');
          print('  whoami    — текущий пользователь');
          print('  ver       — версия системы');
          print('  sound     — проверить звук');
          print('  exit      — закрыть терминал');
          break;
        case 'dir':
          print(' Содержимое папки C:\\Users\\Admin');
          print('');
          print('  <DIR>   Рабочий стол');
          print('  <DIR>   Документы');
          print('  <DIR>   Загрузки');
          print('  <DIR>   Изображения');
          print('  <DIR>   Музыка');
          print('  <DIR>   Видео');
          print('         0 файлов');
          break;
        case 'cls': out.innerHTML = ''; break;
        case 'echo': print(args.join(' ') || ''); break;
        case 'date': print(new Date().toLocaleString('ru-RU')); break;
        case 'whoami': print('desktop-12\\admin'); break;
        case 'ver': print('Microsoft Windows 12 Pro [Версия 12.0.26100]'); break;
        case 'sound':
          print('Воспроизведение тестового звука…', '#8fd9ff');
          Snd.startup();
          break;
        case 'exit':
          const r = WM.wins.get('terminal');
          if(r){ Snd.close(); r.el.classList.add('closing');
            setTimeout(() => { r.el.remove(); WM.wins.delete('terminal'); WM.updateTaskbar(); }, 190); }
          break;
        default:
          print('"' + cmd + '" не является внутренней или внешней командой.', '#ff7b72');
          Snd.error();
      }
      print('');
    }
  });
  setTimeout(() => inp.focus(), 120);
  body.addEventListener('click', () => inp.focus());
}

const ctx = document.getElementById('ctx');
function showCtx(x, y, items){
  ctx.innerHTML = items.map(it =>
    it.sep ? '<div class="ctx-sep"></div>'
           : `<div class="ctx-item" data-a="${it.a}"><span>${it.e || ''}</span><span>${it.t}</span></div>`
  ).join('');
  ctx.classList.add('on');
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = Math.min(x, innerWidth - w - 10) + 'px';
  ctx.style.top = Math.min(y, innerHeight - h - 10) + 'px';
  ctx.querySelectorAll('.ctx-item').forEach(el => {
    el.addEventListener('click', () => {
      Snd.click();
      hideCtx();
      const a = el.dataset.a;
      if(a === 'refresh'){ toast('Рабочий стол обновлён', '🔄'); }
      if(a === 'personalize'){ WM.open('settings'); }
      if(a === 'explorer'){ WM.open('explorer'); }
      if(a === 'terminal'){ WM.open('terminal'); }
      if(a === 'about'){ WM.open('about'); }
      if(a === 'newfolder'){ toast('Папка «Новая папка» создана', '📁'); }
    });
  });
}
function hideCtx(){ ctx.classList.remove('on'); }

document.addEventListener('click', e => {
  if(!ctx.contains(e.target)) hideCtx();
});

    { sep:true },
